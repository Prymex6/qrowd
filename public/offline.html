<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B0B12">
    <title>Brak połączenia — QRowd</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Inter',system-ui,sans-serif;background:#0B0B12;color:#fff;
            min-height:100dvh;display:flex;align-items:center;justify-content:center;
            padding:1.5rem;text-align:center;overflow:hidden;
        }
        .plama{
            position:fixed;border-radius:9999px;filter:blur(90px);opacity:.16;pointer-events:none;
        }
        .tresc{position:relative;z-index:1;max-width:22rem}
        h1{
            font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.75rem;
            letter-spacing:-.02em;margin-top:1.5rem;
        }
        p{color:#9B9BAF;margin-top:.75rem;line-height:1.6}
        .ikona{font-size:3.5rem}
        button{
            font-family:inherit;font-weight:600;font-size:1rem;color:#fff;border:0;
            background:linear-gradient(135deg,#FF2D78,#7B2DFF);
            padding:1rem 2.5rem;border-radius:9999px;margin-top:2rem;cursor:pointer;
            box-shadow:0 8px 40px rgba(255,45,120,.28);
        }
        .stopka{
            position:fixed;bottom:1.5rem;left:0;right:0;color:#9B9BAF;font-size:.8rem;
        }
        .marka{
            font-family:'Space Grotesk',sans-serif;font-weight:700;
            background:linear-gradient(135deg,#FF2D78,#7B2DFF);
            -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
        }
    </style>
</head>
<body>
    <div class="plama" style="width:22rem;height:22rem;background:#FF2D78;top:-6rem;left:-4rem"></div>
    <div class="plama" style="width:18rem;height:18rem;background:#7B2DFF;bottom:-5rem;right:-4rem"></div>

    <div class="tresc">
        <div class="ikona">📡</div>
        <h1>Straciłeś połączenie</h1>
        <p>
            Muzyka na sali gra dalej — to tylko Twój telefon stracił zasięg.
            Wróć na chwilę bliżej routera albo poczekaj.
        </p>
        <button onclick="location.reload()">Spróbuj ponownie</button>
    </div>

    <div class="stopka"><span class="marka">QRowd</span></div>

    <script>
        // Gdy sieć wróci, wracamy do aplikacji bez czekania na klikniecie.
        window.addEventListener('online', () => location.reload());

        // Zapasowe sprawdzanie: zdarzenie "online" bywa niewiarygodne przy
        // slabym zasiegu, wiec sami pukamy do serwera co kilka sekund.
        setInterval(() => {
            fetch('/manifest.webmanifest', { method: 'HEAD', cache: 'no-store' })
                .then(() => location.reload())
                .catch(() => {});
        }, 5000);
    </script>
</body>
</html>
